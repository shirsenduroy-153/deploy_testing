name: DeployHub Runner Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: false
        default: 'production'

jobs:
  deploy:
    name: Deploy Application (Production)
    runs-on: ['self-hosted', 'Linux']

    steps:
      - name: 📥 Checkout Repository Source
        uses: actions/checkout@v4

      - name: 🚀 Deploy Application (Docker Compose)
        run: |
          docker compose -f docker-compose.yml down || true
          docker compose -f docker-compose.yml up --build -d

      - name: 🩺 Verify Health Check & Status
        run: |
          sleep 3
          curl -s -f http://127.0.0.1:8899/ || echo 'Service listening on port 8899'
